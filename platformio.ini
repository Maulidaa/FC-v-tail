; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stm32f411ceu6]
platform = ststm32
board = blackpill_f411ce
framework = cmsis

; --- Firmware ini bare-metal (CMSIS-only, tanpa HAL/LL ST). SystemInit()
;     dan SystemCoreClock diimplementasikan sendiri di src/system/system_clock.c,
;     dan vector table/Reset_Handler ada di src/startup/startup_stm32f411ceux.s.
;
;     Paket "framework-cmsis-stm32f4" bawaan PlatformIO JUGA meng-compile
;     system_stm32f4xx.c dan gcc/startup_stm32f411xe.s miliknya sendiri.
;     src_filter TIDAK berlaku untuk file itu (src_filter hanya menyaring
;     source di dalam src/ proyek, bukan source package framework eksternal),
;     jadi exclude-nya dilakukan lewat extra_script (lihat pre:exclude_framework_cmsis_sources.py)
;     yang menghapus dua object file itu dari daftar sebelum linking supaya
;     tidak duplicate symbol dengan g_pfnVectors/Default_Handler/SystemInit/
;     SystemCoreClock milik src/startup dan src/system.
extra_scripts = pre:exclude_framework_cmsis_sources.py

; LDF hanya menambah include path folder yang punya .c yang sedang di-compile,
; bukan seluruh pohon src/ -- jadi semua subfolder ditambahkan eksplisit di
; sini supaya #include "error.h", "bsp_pinmap.h", dst. dari folder lain ketemu.
;
; CATATAN: jangan taruh "-T <ldscript>" di build_flags -- build_flags juga
; dipakai untuk tahap compile (bukan cuma link), dan GCC akan salah-parsing
; path linker script itu sebagai "-l<path>" (library) kalau lewat build_flags
; di sini. Linker script sudah diset lewat board_build.ldscript di bawah.
build_flags =
    -D STM32F4
    -D STM32F411xE
    -D STM32F411CEUx
    -I lib/CMSIS/Include
    -I lib/CMSIS/Device/ST/STM32F4xx/Include
    -I include
    -I src/blackbox
    -I src/bsp
    -I src/calibration
    -I src/comms
    -I src/control
    -I src/display
    -I src/fusion
    -I src/nav
    -I src/output
    -I src/power
    -I src/rx
    -I src/scheduler
    -I src/sensors
    -I src/settings
    -I src/system
    

board_build.ldscript = ldscript/STM32F411CEUX_FLASH.ld
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f4x.cfg -c "program {$BUILD_DIR/firmware.elf} verify reset exit"
debug_tool = stlink
debug_server =
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    D:/STM32/FC/stlink_swd.cfg
    -f
    target/stm32f4x.cfg

[env:bench_test_fase_c]
extends = env:stm32f411ceu6
build_flags =
    ${env:stm32f411ceu6.build_flags}
    -D BENCH_TEST_FASE_C
    -D BENCH_TEST_TARGET_BEARING_DEG=90.0f